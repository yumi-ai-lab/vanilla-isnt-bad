<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="VANILLA ISN’T BAD. — 暮らしに合うアプリを、名前やできることから。">
  <title>All flavors. — VANILLA ISN’T BAD.</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/inter/inter-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/flavor-scoops-top-v2.png" as="image" fetchpriority="high">
  <link rel="stylesheet" href="./assets/fonts/fonts.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./menu-demo.css">
  <script type="module" src="./menu-demo.js"></script>
</head>
<body id="top" class="menu-demo" data-view="menu">
  <a class="skip-link" href="#demo-search" data-copy="skip">メニューへ</a>
  <header class="demo-header">
    <div class="demo-return">
      <a id="demo-shop-return" href="./?lang=ja&return=shop#shop"><span aria-hidden="true">←</span><span data-copy="shop">店へ戻る</span></a>
      <button id="demo-menu-back" type="button"><span aria-hidden="true">←</span><span data-copy="back">メニューへ</span></button>
    </div>
    <a class="demo-brand" href="./"><img src="./assets/wordmark-small.svg" width="150" height="12" alt="VANILLA ISN’T BAD."></a>
    <div class="demo-language" role="group" aria-label="Language"><button type="button" data-language="ja" aria-pressed="true">JA</button><span aria-hidden="true">/</span><button type="button" data-language="en" aria-pressed="false">EN</button></div>
  </header>
  <main class="demo-layout">
    <section id="demo-catalog" class="demo-catalog" aria-labelledby="demo-title">
      <div class="demo-intro"><h1 id="demo-title" lang="en">All flavors.</h1><p data-copy="intro">名前や、できることから。</p></div>
      <div class="demo-find">
        <form id="demo-search-form" role="search">
          <label class="sr-only" for="demo-search" data-copy="searchLabel">アプリ名・できることで探す</label>
          <div class="demo-search-field"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m15.5 15.5 5 5"/></svg><input id="demo-search" type="search" maxlength="200" autocomplete="off" spellcheck="false" aria-controls="demo-list" aria-describedby="demo-results"><button id="demo-clear" type="button" hidden>×</button></div>
        </form>
        <div id="demo-categories" class="demo-categories" role="group"></div>
        <div class="demo-results"><p id="demo-results" role="status" aria-live="polite" aria-atomic="true"></p><button id="demo-reset" type="button" data-copy="reset" hidden>絞り込みを解除</button></div>
      </div>
      <ul id="demo-list" class="demo-list"></ul>
      <p id="demo-empty" class="demo-empty" data-copy="empty" hidden>見つかりませんでした。別の言葉で探すか、絞り込みを解除してください。</p>
      <button id="demo-more" class="demo-more" type="button" data-copy="more" hidden>もっと見る</button>
      <p class="demo-disclaimer" data-copy="sample">アプリ名・仕様・説明は、確認用のサンプルです。</p>
    </section>
    <section id="demo-selection" class="demo-selection" aria-labelledby="demo-app-name">
      <div class="demo-table" aria-hidden="true">
        <img class="demo-landscape" src="./assets/terrace-foreground-v2.png" width="1536" height="1024" alt="" fetchpriority="high">
        <div class="demo-breeze">
          <span class="demo-foliage-mask" data-edge="left"><span class="demo-foliage-pattern"></span></span>
          <span class="demo-foliage-mask" data-edge="right"><span class="demo-foliage-pattern"></span></span>
        </div>
        <span id="demo-cup" class="demo-cup"><span class="demo-flavor"><img id="demo-cup-image" src="./assets/flavor-cutouts-v2.png" width="1536" height="1024" alt="" decoding="async" draggable="false"></span></span>
      </div>
      <div class="demo-app-copy">
        <div class="demo-app-heading"><h2 id="demo-app-name" tabindex="-1"></h2><span class="demo-sample-label" data-copy="sampleBadge">サンプル</span></div>
        <p id="demo-purpose" class="demo-purpose"></p>
        <ul id="demo-specs" class="demo-specs"></ul>
        <div class="demo-launch"><a id="demo-open" target="_blank" rel="noopener noreferrer" hidden><span data-copy="open">アプリを開く</span><span aria-hidden="true">↗</span></a><button id="demo-unavailable" type="button" disabled><span data-copy="open">アプリを開く</span><span aria-hidden="true">↗</span></button><p id="demo-launch-status">表示確認用のサンプルです。</p></div>
        <section id="demo-mockup" class="demo-mockup" aria-labelledby="demo-mockup-title" hidden>
          <div class="demo-mockup-heading"><h3 id="demo-mockup-title" data-copy="mockupTitle">開いたら、こんな感じ。</h3><span data-copy="mockupBadge">画面イメージ</span></div>
          <figure><div id="demo-mockup-art" class="demo-mockup-art"></div><figcaption data-copy="mockupCaption">デザイン確認用のモックアップです。</figcaption></figure>
        </section>
        <details id="demo-screen" class="demo-screen" hidden><summary data-copy="screen">画面を見る</summary><div class="demo-screen-body"><p id="demo-screen-status" class="demo-screen-status" role="status" aria-live="polite"></p><figure id="demo-screen-figure" hidden><div id="demo-screen-art"></div><figcaption id="demo-screen-caption"></figcaption></figure><button id="demo-screen-retry" type="button" data-copy="imageRetry" hidden>もう一度読み込む</button></div></details>
        <div id="demo-craft" class="demo-craft"><h3 data-copy="craft">つくり手のひとこと</h3><p id="demo-craft-lead"></p><details id="demo-craft-more"><summary data-copy="craftMore">ほかのこだわり</summary><ul id="demo-craft-points"></ul></details></div>
        <button id="demo-browse" class="demo-browse" type="button"><span aria-hidden="true">←</span><span data-copy="browse">メニューでほかも見る</span></button>
      </div>
    </section>
    <p id="demo-announcement" class="sr-only" role="status" aria-live="polite"></p>
    <noscript><p>アプリを選ぶにはJavaScriptを有効にしてください。</p></noscript>
  </main>
  <footer class="demo-footer"><span lang="en">Good as it is.</span><button id="demo-motion" type="button" aria-pressed="true"></button></footer>
</body>
</html>
