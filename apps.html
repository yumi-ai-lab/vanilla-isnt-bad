<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ed">
  <meta name="description" content="Apps that feel good from the start, with room to make them your own. VANILLA ISN’T BAD.">
  <title>All flavors. — VANILLA ISN’T BAD.</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/inter/inter-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./assets/fonts/fonts.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./showcase.css">
  <link rel="stylesheet" href="./terrace.css">
  <script type="module" src="./main.js"></script>
</head>
<body id="top" data-page="showcase">
  <a class="skip-link" href="#app-grid" data-i18n="nav.skip">Skip to the apps</a>
  <main class="showcase-main terrace" id="terrace">
    <div class="terrace-scene">
      <picture class="terrace-background">
        <source media="(max-width: 680px)" srcset="./assets/terrace-background-mobile-v1.png">
        <img src="./assets/terrace-background-v1.png" width="1536" height="1024" alt="" fetchpriority="high">
      </picture>
      <div class="terrace-shade" aria-hidden="true"></div>
      <header class="terrace-nav">
        <a class="back-link" data-store-return href="./#shop"><span aria-hidden="true">←</span><span data-i18n="showcase.back" data-copy-stable>Back to the shop</span></a>
        <div class="terrace-actions">
          <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="all-flavors"><span data-i18n="terrace.menu" data-copy-stable>All apps</span><span aria-hidden="true">＋</span></button>
          <div class="language-switch" role="group" aria-label="Language">
            <button type="button" data-language="en" aria-pressed="true">EN</button><span aria-hidden="true">/</span><button type="button" data-language="ja" aria-pressed="false">JA</button>
          </div>
        </div>
      </header>
      <div class="terrace-heading"><h1 lang="en" data-i18n="showcase.title">All flavors.</h1></div>
      <ul id="app-grid" class="table-cups" tabindex="-1" data-i18n-aria="terrace.choose" aria-label="Choose a cup"></ul>
      <nav class="terrace-pager" aria-label="Flavors">
        <button id="previous-cups" type="button" data-i18n-aria="terrace.previous" aria-label="Previous flavors"><span aria-hidden="true">←</span></button>
        <span id="cup-position" role="status" aria-live="polite" aria-atomic="true"></span>
        <button id="next-cups" type="button" data-i18n-aria="terrace.next" aria-label="More flavors"><span aria-hidden="true">→</span></button>
      </nav>
    </div>
    <section id="app-detail" class="tasting-note" tabindex="-1" aria-labelledby="dialog-title" hidden>
      <div class="tasting-topline">
        <span class="tasting-eyebrow" data-i18n="terrace.selected">Your choice</span>
        <button id="close-tasting" class="tasting-close" type="button"><span data-i18n="terrace.back" data-copy-stable>Back to the table</span><span aria-hidden="true">×</span></button>
      </div>
      <div class="dialog-layout">
        <div id="dialog-preview" class="dialog-preview"></div>
        <div class="dialog-copy">
          <div class="dialog-heading"><div id="dialog-icon" hidden></div><h2 id="dialog-title" lang="en"></h2></div>
          <p class="dialog-tagline" id="dialog-tagline"></p>
          <div class="platforms" id="dialog-platforms"></div>
          <p class="dialog-description" id="dialog-description"></p>
          <h3 class="features-heading" id="dialog-features-heading" data-i18n="dialog.features">A few simple things</h3>
          <ul id="dialog-features" class="dialog-features"></ul>
          <p id="dialog-status" class="preview-note"></p>
          <a class="primary-link" id="dialog-link" target="_blank" rel="noopener noreferrer" hidden><span data-i18n="dialog.open" data-copy-stable>Open app</span><span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </section>
    <section id="all-flavors" class="flavor-menu" tabindex="-1" aria-labelledby="menu-title" hidden>
      <div class="flavor-menu-heading">
        <div><h2 id="menu-title" data-i18n="terrace.menu">All apps</h2><p id="app-count" class="app-count"></p></div>
        <button id="menu-close" type="button" data-i18n-aria="terrace.closeMenu" aria-label="Close the menu">×</button>
      </div>
      <ul id="flavor-menu-list" class="flavor-menu-list"></ul>
    </section>
    <p class="preview-note terrace-note" data-preview-note data-i18n="gallery.preview" data-copy-stable>Sample apps for this preview.</p>
    <noscript><p class="terrace-note">アプリを選ぶにはJavaScriptを有効にしてください。</p></noscript>
  </main>
  <footer class="site-footer section-width">
    <div>
      <a class="footer-brand" href="./"><img src="./assets/wordmark-small.svg" class="brand-mark" width="150" height="12" alt="VANILLA ISN’T BAD." loading="lazy"></a>
      <small>© <span id="year">2026</span> VANILLA ISN’T BAD.</small>
    </div>
    <div class="footer-actions">
      <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="true"><span data-i18n="motion.label" data-copy-stable>Motion</span><span id="motion-state">On</span></button>
      <a class="text-link" href="#top"><span data-i18n="footer.pageTop" data-copy-stable>Back to top</span><span aria-hidden="true">↑</span></a>
    </div>
  </footer>
</body>
</html>
