<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ed">
  <meta name="description" content="Apps that feel good from the start, with room to make them your own. VANILLA ISN’T BAD.">
  <title>VANILLA ISN’T BAD. — Good as it is.</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/kiosk-warm.png" as="image" fetchpriority="high">
  <link rel="preload" href="./assets/fonts/inter/inter-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./assets/fonts/fonts.css">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./main.js"></script>
</head>
<body id="top">
  <a class="skip-link" href="#apps" data-i18n="nav.skip">Skip to the apps</a>
  <header class="site-header">
    <a href="#top" class="header-brand" aria-label="VANILLA ISN’T BAD. home"><img src="./assets/wordmark-small.svg" class="brand-mark" width="150" height="12" alt="VANILLA ISN’T BAD." fetchpriority="high"></a>
    <nav class="header-nav" aria-label="Main navigation">
      <a href="#apps" data-i18n="nav.apps">Apps</a>
      <a href="#about" data-i18n="nav.about">Our take</a>
      <div class="language-switch" role="group" aria-label="Language">
        <button type="button" data-language="en" aria-pressed="true">EN</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-language="ja" aria-pressed="false">JA</button>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="sky" aria-hidden="true"></div>
      <div class="hero-copy">
        <h1 id="hero-title" lang="en">Good as it is.</h1>
        <p class="hero-subtitle" lang="en">Yours if you want.</p>
        <p class="hero-description" lang="ja" data-i18n="hero.description"></p>
        <a class="text-link hero-link" href="#apps">
          <span data-i18n="hero.cta">Explore the apps</span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20"><path d="M10 3v13m-5-5 5 5 5-5" /></svg>
        </a>
      </div>

      <div class="storefront">
        <figure class="kiosk-scene" aria-labelledby="kiosk-caption">
          <div class="kiosk-wrap">
            <svg class="kiosk-art" viewBox="0 40 1309 680" aria-hidden="true">
              <defs>
                <clipPath id="kiosk-silhouette">
                  <path d="M109 245V223C109 148 163 84 239 84H1075C1152 84 1199 139 1199 230V720H109Z"/>
                  <path d="M590 85V63Q652 39 718 62V85Z"/>
                  <rect x="98" y="290" width="30" height="32" rx="8"/>
                  <rect x="99" y="612" width="26" height="75" rx="8"/>
                  <rect x="1182" y="290" width="28" height="33" rx="8"/>
                  <rect x="1186" y="610" width="17" height="29" rx="3"/>
                </clipPath>
              </defs>
              <image href="./assets/kiosk-warm.png" width="1309" height="1201" clip-path="url(#kiosk-silhouette)"/>
            </svg>
            <picture class="kiosk-wordmark" aria-hidden="true">
              <source media="(max-width: 680px)" srcset="./assets/wordmark-small.svg">
              <img src="./assets/wordmark-display.svg" width="440" height="36" alt="">
            </picture>
            <a class="hanging-sign" href="#apps" data-i18n-aria="kiosk.link" aria-label="Explore the apps">
              <span class="sign-plate"><span class="sign-label">APPS</span></span>
            </a>
          </div>
          <figcaption class="sr-only" id="kiosk-caption" data-i18n="kiosk.caption">Our little storefront, with a vanilla-striped awning and an app shelf below the counter.</figcaption>
        </figure>

        <section class="apps-section" id="apps" aria-labelledby="apps-title" tabindex="-1">
          <div class="section-heading">
            <h2 id="apps-title" lang="en" data-i18n="gallery.title">APPS</h2>
          </div>
          <ul class="app-grid" id="app-grid" aria-hidden="true">
            <li class="empty-card" aria-hidden="true"><div class="case-frame"><div class="glass-pane"></div></div></li>
            <li class="empty-card" aria-hidden="true"><div class="case-frame"><div class="glass-pane"></div></div></li>
            <li class="empty-card" aria-hidden="true"><div class="case-frame"><div class="glass-pane"></div></div></li>
            <li class="empty-card" aria-hidden="true"><div class="case-frame"><div class="glass-pane"></div></div></li>
            <li class="empty-card" aria-hidden="true"><div class="case-frame"><div class="glass-pane"></div></div></li>
            <li class="empty-card" aria-hidden="true"><div class="case-frame"><div class="glass-pane"></div></div></li>
          </ul>
          <div class="empty-note" id="empty-note">
            <p data-i18n="gallery.empty">In the making.</p>
          </div>
        </section>
        <div class="storefront-base" aria-hidden="true"></div>
      </div>
    </section>

    <section class="about-section section-width" id="about" aria-labelledby="about-title">
      <h2 id="about-title" data-i18n="about.title">Start with how it feels.</h2>
      <p class="about-copy" data-i18n="about.description">Like vanilla, good on its own.
We make apps that feel right from the start, with room to make them yours.</p>
    </section>
  </main>

  <footer class="site-footer section-width">
    <div>
      <a class="footer-brand" href="#top"><img src="./assets/wordmark-small.svg" class="brand-mark" width="150" height="12" alt="VANILLA ISN’T BAD." loading="lazy"></a>
      <small>© <span id="year">2026</span> VANILLA ISN’T BAD.</small>
    </div>
    <div class="footer-actions">
      <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="true">
        <span data-i18n="motion.label">Motion</span>
        <span id="motion-state">On</span>
      </button>
      <a class="text-link" href="#top"><span data-i18n="footer.top">Back to the sky</span><span aria-hidden="true">↑</span></a>
    </div>
  </footer>

  <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title">
    <button type="button" class="dialog-close" data-i18n-aria="dialog.close" aria-label="Close app details" autofocus>
      <svg aria-hidden="true" viewBox="0 0 20 20" width="20" height="20"><path d="m5 5 10 10M15 5 5 15"/></svg>
    </button>
    <div id="dialog-icon" class="dialog-icon"></div>
    <h2 id="dialog-title"></h2>
    <p class="dialog-tagline" id="dialog-tagline"></p>
    <div class="platforms" id="dialog-platforms"></div>
    <p class="dialog-description" id="dialog-description"></p>
    <a class="primary-link" id="dialog-link" target="_blank" rel="noopener noreferrer"><span data-i18n="dialog.open">Open app</span><span aria-hidden="true">↗</span></a>
  </dialog>
</body>
</html>
