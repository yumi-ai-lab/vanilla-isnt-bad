<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ed">
  <meta name="robots" content="noindex">
  <meta name="description" content="白い丸テーブルと木漏れ日のあるテラス。VANILLA ISN’T BAD. の画面案です。">
  <meta property="og:title" content="テラス案 — VANILLA ISN’T BAD.">
  <meta property="og:description" content="カップを選んで楽しむ、テラスの確認用ビジュアル。">
  <meta property="og:image" content="https://yumi-ai-lab.github.io/vanilla-isnt-bad/assets/terrace-scene-v1.png">
  <title>テラス案 — VANILLA ISN’T BAD.</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/fonts/fonts.css">
  <style>
    :root { color-scheme: light; font-family: "Inter Variable", "Noto Sans JP Variable", sans-serif; color: #282826; background: #f7f3ed; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1328px; margin: auto; padding: 28px 24px 36px; }
    header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 18px; line-height: 1.6; font-weight: 500; }
    p { color: #67675f; font-size: 13px; line-height: 1.8; }
    a { color: inherit; text-underline-offset: 5px; }
    .original { display: inline-flex; align-items: center; min-height: 44px; font-size: 13px; }
    .image-link { display: block; }
    img { display: block; width: 100%; height: auto; border-radius: 5px; }
    figure { margin: 0; }
    figcaption { margin-top: 16px; color: #67675f; font-size: 12px; line-height: 1.8; }
    footer { margin-top: 24px; }
    footer a { display: inline-flex; align-items: center; min-height: 44px; font-size: 13px; }
    :focus-visible { outline: 2px solid #545e4c; outline-offset: 5px; }
    @media (max-width: 680px) {
      main { padding: 18px 12px 24px; }
      header, figcaption, footer { padding-inline: 6px; }
      header { margin-bottom: 14px; }
      h1 { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>テラス案の確認用画像</h1>
      <a class="original" href="./assets/terrace-scene-v1.png">画像を大きく開く ↗</a>
    </header>
    <figure>
      <a class="image-link" href="./assets/terrace-scene-v1.png" aria-label="テラス案の画像を大きく開く">
        <img src="./assets/terrace-scene-v1.png" width="1536" height="1024" fetchpriority="high" alt="木漏れ日の落ちる白い金属の丸テーブルに、バニラ・いちご・ピスタチオの三つのカップ。奥にVANILLA ISN’T BAD.のアイス屋が見え、手前にはFocus、Notes、Tripのアプリ名と用途が添えられています。">
      </a>
      <figcaption>空気感と構図を確認するための静止画です。</figcaption>
    </figure>
    <footer><a href="./?lang=ja">← サイトへ戻る</a></footer>
  </main>
</body>
</html>
